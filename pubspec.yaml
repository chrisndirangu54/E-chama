name: echama
description: Blockchain-powered chama management platform with ChamaCoin
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.24.2
  cloud_firestore: ^4.14.0
  firebase_auth: ^4.16.0
  firebase_storage: ^11.6.0
  cloud_functions: ^4.6.0
  http: ^1.1.0
  image_picker: ^1.0.7
  geolocator: ^11.0.0
  web3dart: ^2.7.1
  flutter_secure_storage: ^9.0.0
  charts_flutter: ^0.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
